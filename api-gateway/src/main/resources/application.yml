spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth
              predicates:
                - Path=/api/users/**
            - id: connection-service
              uri: lb://connection
              predicates:
                - Path=/api/connections/**
            - id: conversation-service
              uri: lb://message
              predicates:
                - Path=/api/conversations/**
            - id: message-service
              uri: lb://message
              predicates:
                - Path=/api/messages/**
            - id: message-websocket
              uri: lb:ws://message
              predicates:
                - Path=/ws
            - id: notification-service
              uri: lb://notification
              predicates:
                - Path=/api/notifications/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
